[project]
name = "shopmaster-agent"
version = "0.1.0"
description = "A LangChain agent (create_agent) that talks to the messy ShopMaster legacy API."
readme = "README.md"
requires-python = ">=3.11"   # tested with 3.12
dependencies = [
    "langchain==1.5.0",
    "langchain-core==1.8.0",
    "langchain-google-genai==4.5.0",
    "langchain-groq==1.1.3",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-mcp-adapters==0.3.2",
    "mcp==1.30.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "python-dotenv",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]   # `uv sync` installs this group by default

[tool.uv]
package = false           # a set of scripts and folders, not an installable package
