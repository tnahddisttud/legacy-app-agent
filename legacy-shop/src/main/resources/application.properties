quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.log.level=INFO

# --- ShopMaster knobs (all overridable via env vars, see docker-compose.yml) ---
shop.db.path=${SHOP_DB_PATH:./data/shop.db}
shop.auth.user=${SHOP_USER:svc_agent}
shop.auth.password=${SHOP_PASS:Winter2009!}
shop.auth.token-ttl-sec=${SHOP_TOKEN_TTL_SEC:300}
shop.rate.max=${SHOP_RATE_MAX:15}
shop.rate.window-sec=${SHOP_RATE_WINDOW_SEC:10}
shop.chaos.error-rate=${SHOP_CHAOS_ERROR_RATE:0.05}
shop.chaos.max-latency-ms=${SHOP_CHAOS_MAX_LATENCY_MS:250}
shop.chaos.post-commit-error-rate=${SHOP_CHAOS_POST_COMMIT_ERROR_RATE:0.0}
